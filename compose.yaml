name: practicum-hub

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-practicum}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-practicum}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-practicum}
      POSTGRES_USER: ${POSTGRES_USER:-practicum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: practicum-hub-api:local
    pull_policy: never
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: practicum-hub-api:local
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: practicum_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d practicum_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://test:test-only-password@test-db:5432/practicum_test
      JWT_SECRET: test-only-secret-at-least-32-characters
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && alembic check && pytest -q -p no:cacheprovider"]

volumes:
  postgres_data:

